version: '3.8'

services:
  db:
    image: postgres:16
    container_name: collabcanvas-db-prod
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: collabcanvas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  http-backend:
    build:
      context: .
      dockerfile: apps/http-backend/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/collabcanvas
      JWT_SECRET: your-super-secret-key
      PORT: 3001
      ALLOWED_ORIGIN: "http://localhost:3000"
    depends_on:
      - db

  ws-backend:
    build:
      context: .
      dockerfile: apps/ws-backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/collabcanvas
      JWT_SECRET: your-super-secret-key
      PORT: 8080
    depends_on:
      - db

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_HTTP_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: ws://localhost:8080
    depends_on:
      - http-backend
      - ws-backend

volumes:
  postgres_data:
